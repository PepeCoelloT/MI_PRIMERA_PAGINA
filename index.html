<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página Web de José Coello</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: white;
    padding: 40px;
}

/* H1 */
h1{
    color: #00ffff;
    font-size: 3rem;
    text-shadow: 3px 3px 8px black;
    border-left: 8px solid #00ffff;
    padding-left: 15px;
}

/* H2 */
h2{
    color: #ffd700;
    border-bottom: 3px solid #ffd700;
    padding-bottom: 8px;
}

/* H3 */
h3{
    background: linear-gradient(90deg,#00ffff,#00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* H4 */
h4{
    color: #ff7b00;
    text-transform: uppercase;
    letter-spacing: 2px;
}

/* H5 */
h5{
    color: #ff4d6d;
    font-style: italic;
}

</style>

</head>

<body>

<h1>Bienvenidos a mi página web</h1>

<h2>Mi nombre es José Coello</h2>

<h3>Esta es mi página web de prueba</h3>

<h4>Espero que les guste</h4>

<h5>Gracias por visitar mi página web</h5>

</body>
</html>
